services:
  arena-postgres:
    image: pgvector/pgvector:pg16
    container_name: arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena_user
      POSTGRES_PASSWORD: arena_password
      POSTGRES_DB: arena_db
    ports:
      - "5433:5432"
    volumes:
      - arena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_user -d arena_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  arena-redis:
    image: redis:7-alpine
    container_name: arena-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - arena_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arena_pgdata:
  arena_redisdata:
